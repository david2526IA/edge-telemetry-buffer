[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-telemetry-buffer"
version = "0.1.0"
description = "Durable SQLite queue primitives for offline-first edge telemetry."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "David"}]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
edge-buffer = "edge_telemetry_buffer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
